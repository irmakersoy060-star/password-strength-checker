<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🔐 Password Strength Checker</h1>
    <p class="subtitle">
        Check how secure your password is in real time.
    </p>

    <div class="input-box">
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button id="togglePassword">👁</button>
    </div>
    <div class="buttons">
        <button id="generateBtn">Generate Strong Password</button>
        <button id="copyBtn">Copy Password</button>
    </div>
    <div class="strength-bar">
        <div id="strengthFill"></div>
    </div>

    <h2 id="strengthText">Strength: -</h2>

    <div class="score">
        Security Score:
        <span id="score">0</span>/100
    </div>
    <div class="crack-time">
        Estimated Crack Time:
        <span id="crackTime">Instantly</span>
    </div>

    <div class="checks">

        <div id="length">❌ At least 8 characters</div>

        <div id="uppercase">❌ Uppercase Letter</div>

        <div id="lowercase">❌ Lowercase Letter</div>

        <div id="number">❌ Number</div>

        <div id="special">❌ Special Character</div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
